aid: classaction
name: ClassAction
description: ClassAction operates enjin (集団訴訟プラットフォーム enjin), a Japanese class-action / group-litigation
  platform that connects consumers who have suffered damages from the same party with registered attorneys to
  pursue collective lawsuits. Victims report their damages, registered lawyers volunteer to take on cases, and
  participants share legal costs and evidence so that even small-value claimants can afford to litigate. The
  service launched in May 2018 and is free for users. This is a consumer-facing legal-tech website with no
  public developer API, documentation, or SDKs; it was added to the API Evangelist network as a 500 Global
  portfolio lead.
